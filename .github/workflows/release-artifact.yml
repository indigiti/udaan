name: Udaan Certified Release Artifact

on:
  workflow_run:
    workflows:
      - Udaan Security and Syntax
    types:
      - completed

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify exact certified SHA
        shell: bash
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"

      - name: Build deterministic certified package
        id: package
        shell: bash
        env:
          CERTIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$CERTIFIED_SHA" OUTPUT_DIR="$RUNNER_TEMP/udaan-release" bash ops/package-release.sh
          version="$(php -r '$c=require "config.php"; echo (string)$c["version"];')"
          short_sha="${CERTIFIED_SHA:0:12}"
          archive="$RUNNER_TEMP/udaan-release/udaan-v${version}-${short_sha}.tar.gz"
          checksum="${archive}.sha256"
          test -s "$archive"
          test -s "$checksum"
          sha256sum -c "$checksum"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          stage="$RUNNER_TEMP/udaan-release/udaan"
          test -f "$stage/public/index.php"
          test -f "$stage/public/.htaccess"
          test -f "$stage/public/api/answer.php"
          test -f "$stage/private/bootstrap.php"
          test -f "$stage/private/config.php"
          test -f "$stage/private/.udaan-split-runtime"
          test -f "$stage/private/data/content/cards.json"
          test -f "$stage/private/ops/.htaccess"
          test ! -e "$stage/public/lib"
          test ! -e "$stage/public/data"
          test ! -e "$stage/public/ops"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "artifact_name=digiops-release" >> "$GITHUB_OUTPUT"

      - name: Upload certified deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.stage }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
