        run: |
          set -euo pipefail
          grep -q "'version' => '0.15.0'" config.php
          grep -q "udaan-v0.15.0" sw.js
          grep -q "qoi.js?v=0.15.0" question_of_india.php
          grep -q "RewriteRule ^player/?$ player.php" .htaccess
          grep -q "RewriteRule ^today/?$ today.php" .htaccess
          grep -q "RewriteRule ^progress/?$ progress.php" .htaccess
          grep -q "RewriteRule ^readiness/?$ readiness.php" .htaccess
          grep -q "RewriteRule ^fit/?$ fit.php" .htaccess
          grep -q "RewriteRule ^momentum/?$ momentum.php" .htaccess
          grep -q "RewriteRule ^coach/?$ coach.php" .htaccess
          grep -q "RewriteRule ^coach/action/?$ coach_action.php" .htaccess
          grep -q "RewriteRule ^connect/?$ connect.php" .htaccess
          grep -q "RewriteRule ^connect/action/?$ connect_action.php" .htaccess
          grep -q "RewriteRule ^team/(" .htaccess
          grep -q "RewriteRule ^team/action/?$ team_action.php" .htaccess
          grep -q "RewriteRule ^leagues/?$ leagues.php" .htaccess
          grep -q "RewriteRule ^league/(" .htaccess
