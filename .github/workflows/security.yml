      - name: Verify DigiOps release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'artifact_name=digiops-release' .github/workflows/release-artifact.yml
          grep -Fq 'outputs.artifact_name' .github/workflows/release-artifact.yml
          grep -Fq 'RUNNER_TEMP/udaan-release/udaan' .github/workflows/release-artifact.yml
          grep -Fq 'outputs.stage' .github/workflows/release-artifact.yml
          grep -Fq 'include-hidden-files: true' .github/workflows/release-artifact.yml
          grep -Fq 'STAGE/index.php' ops/package-release.sh

      - name: Verify protected operational directories
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'Require[[:space:]]+all[[:space:]]+denied' data/.htaccess
          grep -Eq 'Require[[:space:]]+all[[:space:]]+denied' ops/.htaccess
