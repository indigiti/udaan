name: Udaan Security and Syntax

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject any tracked secrets and runtime state
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files)"

          reject() {
            local pattern="$1"
            local label="$2"
            local hits
            hits="$(printf '%s\n' "$tracked" | grep -E "$pattern" || true)"
            if [[ -n "$hits" ]]; then
              echo "::error::$label"
              printf '%s\n' "$hits"
              exit 1
            fi
          }

          runtime_hits="$(printf '%s\n' "$tracked" | grep -E '^data/(rooms|history|user-cache|sync-outbox|aggregates|rate-limit|insights|players|events|missions|readiness)/' | grep -vF '/.gitkeep' || true)"
          if [[ -n "$runtime_hits" ]]; then
            echo "::error::Runtime learner/session/aggregate state must never be tracked."
            printf '%s\n' "$runtime_hits"
            exit 1
          fi

          reject '^data/(app-secret|storage-encryption|content-admin|content-signing)\.key$' 'Runtime cryptographic/authentication keys must never be tracked.'
          reject '^data/maintenance\.flag$' 'Maintenance state is runtime-only and must never be tracked.'
          reject '^data/imports/pending/.+\.json$' 'Pending import verification snapshots must never be tracked.'
          reject '^data/content/(manifest\.json|runtime-cache\.php|import-log\.json|\.import\.lock|packs/.+\.json|backups/cards-.+\.json)$' 'Generated runtime content artifacts must never be tracked.'
          reject '(^|/)__pycache__/|\.py[co]$' 'Python bytecode/cache artifacts must never be tracked.'

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets/js -type f -name '*.js' -print0)
          node --check sw.js

      - name: Runtime cache, Player and Mission smoke
        shell: bash
        run: |
          set -euo pipefail
          php tests/runtime_smoke.php
          php tests/player_foundation_smoke.php
          php tests/mission_engine_smoke.php
          php tests/performance_graph_smoke.php
          php tests/daily_readiness_smoke.php

      - name: Production readiness repository preflight
        shell: bash
        run: |
          set -euo pipefail
          php ops/preflight.php --repository-mode
          php tests/proxy_smoke.php
          php tests/redis_policy_smoke.php

      - name: Certified release package smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/package-release.sh
          SOURCE_SHA="$(git rev-parse HEAD)" OUTPUT_DIR="$RUNNER_TEMP/udaan-release" bash ops/package-release.sh
          test -f "$RUNNER_TEMP/udaan-release"/udaan-v*.tar.gz
          test -f "$RUNNER_TEMP/udaan-release"/udaan-v*.tar.gz.sha256

      - name: Verify readiness and Redis-required contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "RewriteRule ^ready/?$ ready.php" .htaccess
          grep -q "Required Redis runtime is unavailable" bootstrap.php
          grep -q "redisRequired()" bootstrap.php
          grep -q "UDAAN_TRUST_PROXY_HEADERS" config.php
          grep -q "REDIS_REQUIRED" config.php

      - name: Verify presenter state guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Presenter state access denied" api/state.php
          grep -q "state_token" bootstrap.php
          grep -q "future_topic_labels()" bootstrap.php

      - name: Verify browser security headers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Content-Security-Policy" .htaccess
          grep -q "Strict-Transport-Security" .htaccess
          grep -q "Cross-Origin-Resource-Policy" .htaccess

      - name: Verify public content delivery is read only
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nF 'content_manifest(true)' api health.php; then
            echo "::error::Public HTTP endpoints must never rebuild/sign content."
            exit 1
          fi

      - name: Reject stale v0.6.0 runtime asset references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'v=0\.6\.0' --include='*.php' .; then
            echo "::error::Runtime PHP still references the old PWA asset cache key."
            exit 1
          fi
          if grep -n 'udaan-v0\.6\.0' sw.js; then
            echo "::error::Service-worker cache version was not advanced."
            exit 1
          fi

      - name: Reject stale v0.8.0 runtime asset references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'v=0\.8\.0' --include='*.php' .; then
            echo "::error::Runtime PHP still references the v0.8.0 asset cache key."
            exit 1
          fi
          if grep -n 'udaan-v0\.8\.0' sw.js; then
            echo "::error::Service-worker cache version was not advanced to v0.9.0."
            exit 1
          fi

      - name: Reject stale v0.9.0 runtime asset references
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n 'v=0\.9\.0' --include='*.php' .; then
            echo "::error::Runtime PHP still references the v0.9.0 asset cache key."
            exit 1
          fi
          if grep -n 'udaan-v0\.9\.0' sw.js; then
            echo "::error::Service-worker cache version was not advanced to v0.10.0."
            exit 1
          fi

      - name: Verify v0.10.0 Daily Readiness contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'version' => '0.10.0'" config.php
          grep -q "udaan-v0.10.0" sw.js
          grep -q "qoi.js?v=0.10.0" question_of_india.php
          grep -q "RewriteRule ^player/?$ player.php" .htaccess
          grep -q "RewriteRule ^today/?$ today.php" .htaccess
          grep -q "RewriteRule ^progress/?$ progress.php" .htaccess
          grep -q "RewriteRule ^readiness/?$ readiness.php" .htaccess
          grep -q "RewriteRule ^mission/" .htaccess
          grep -q "RewriteRule ^admin/players/?$ admin_players.php" .htaccess
          grep -q "function udaan_player_normalize" lib/Player.php
          grep -q "profile_visibility'=>'private'" lib/Player.php
          grep -q "parent_or_institution_sharing'=>false" lib/Player.php
          grep -q "function udaan_mission_ensure_daily" lib/Mission.php
          grep -q "function udaan_mission_apply_status" lib/Mission.php
          grep -q "function udaan_mission_complete_by_source" lib/Mission.php
          grep -q "function udaan_performance_window" lib/Performance.php
          grep -q "function udaan_performance_personal_bests" lib/Performance.php
          grep -q "function udaan_daily_readiness_entry" lib/DailyReadiness.php
          grep -q "function udaan_daily_readiness_band" lib/DailyReadiness.php
          grep -q "function udaan_daily_readiness_mission_guidance" lib/DailyReadiness.php
          grep -q "function udaan_mission_apply_readiness" lib/Mission.php
          grep -q "performance.personal_best" lib/Mission.php
          grep -q "PERFORMANCE GRAPH · 14 DAYS" progress.php
          grep -q "getMissionState" lib/Store.php
          grep -q "mutateMissionState" lib/Store.php
          grep -q "mission_storage_directory" lib/Readiness.php
          grep -q "daily_readiness_storage_directory" lib/Readiness.php
          grep -q "getReadinessState" lib/Store.php
          grep -q "mutateReadinessState" lib/Store.php
          grep -q "DAILY READINESS · PRIVATE" readiness.php
          grep -q "READINESS HISTORY · PRIVATE" progress.php
          grep -q "daily_readiness_storage" health.php
          grep -q "data/readiness" ops/package-release.sh
          grep -q "udaan_mission_complete_by_source" done.php
          grep -q "Mission and readiness data are private runtime data" today.php
          grep -q "Too many offline events in one sync request" api/offline_sync.php
          grep -q "'card_map'" lib/helpers.php

      - name: Verify DigiOps release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'artifact_name=digiops-release' .github/workflows/release-artifact.yml
          grep -Fq 'outputs.artifact_name' .github/workflows/release-artifact.yml
          grep -Fq 'RUNNER_TEMP/udaan-release/udaan' .github/workflows/release-artifact.yml
          grep -Fq 'outputs.stage' .github/workflows/release-artifact.yml
          grep -Fq 'include-hidden-files: true' .github/workflows/release-artifact.yml
          grep -Fq 'STAGE/index.php' ops/package-release.sh

      - name: Verify protected operational directories
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'Require[[:space:]]+all[[:space:]]+denied' data/.htaccess
          grep -Eq 'Require[[:space:]]+all[[:space:]]+denied' ops/.htaccess
